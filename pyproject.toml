[project]
name = "rag-starter"
version = "0.2.0"
description = "Your first RAG pipeline. On your own documents. Completely local."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "chromadb>=0.5,<1.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.10",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Reflowing the prompt template would change the text sent to the model.
"src/generator.py" = ["E501"]
# Notebook prose and URLs are read rendered, not in a 100-column source view.
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
